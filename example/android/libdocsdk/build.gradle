// Consumes Identixia Document Reader AAR (same as ID-Document-Recognition-Liveness-Detection-Android).
def aar = file("documentreadersdk.aar")
if (!aar.exists()) {
    throw new GradleException(
        "Missing example/android/libdocsdk/documentreadersdk.aar.\n" +
        "Copy it from ID-Document-Recognition-Liveness-Detection-Android/libdocsdk/ or the Drive Android pack."
    )
}
configurations.maybeCreate("default")
artifacts.add("default", aar)
